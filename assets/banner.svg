    <circle cx="109" cy="53" r="5" fill="#d4fae9"/>
    <path d="M109 53H248V31" fill="none" stroke="#7ecbb7" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="246" y="24" text-anchor="end" fill="#b8dcd2" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1">MEASURE WITH CONTEXT</text>
