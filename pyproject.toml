[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speechmetrichub"
version = "0.3.0"
description = "Protocol-aware speech evaluation: 64 metric variants, upstream scorers, traceable results"
authors = [{name = "Yang Xu"}]
keywords = ["speech", "evaluation", "asr", "diarization", "speech-quality", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/YangXu212/SpeechMetricHub"
Documentation = "https://github.com/YangXu212/SpeechMetricHub/blob/main/docs/README.md"
Issues = "https://github.com/YangXu212/SpeechMetricHub/issues"
Changelog = "https://github.com/YangXu212/SpeechMetricHub/blob/main/CHANGELOG.md"

[project.optional-dependencies]
transcription = ["meeteval==0.4.3", "kaldialign==0.12.0"]
quality = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "pystoi==0.4.1", "pesq==0.0.4", "soxr>=0.3"]
separation = ["fast-bss-eval==0.1.3", "soundfile>=0.12"]
diarization = ["pyannote.metrics==3.2.1", "pyannote.core==5.0.0", "pyannote.database==5.1.3"]
models = ["torch==2.8.0", "torchaudio==2.8.0", "numpy<2", "soundfile>=0.12", "soxr==0.5.0.post1", "transformers==4.48.2", "librosa==0.9.2", "pandas<3", "PyYAML>=6", "phonemizer==3.6.0", "kaldialign==0.12.0"]
aesthetics = ["audiobox-aesthetics==0.0.4"]
scoreq = ["scoreq==1.0.0"]
dnsmos = ["onnxruntime==1.16.3", "librosa==0.9.2", "pandas<3"]
sheet = ["s3prl==0.4.18"]
speaker = ["espnet==202412", "setuptools<74"]
dev = ["build>=1", "pytest>=8", "ruff>=0.8", "tomli>=2; python_version<'3.11'"]

[project.scripts]
speechmetrichub = "speech_eval.cli:main"
speech-eval = "speech_eval.cli:main"

[tool.setuptools.packages.find]
include = ["speech_eval*", "speechmetrichub*"]

[tool.setuptools.package-data]
speech_eval = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
