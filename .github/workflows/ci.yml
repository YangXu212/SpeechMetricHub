name: core-metrics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'numpy<2' '.[transcription,quality,separation,diarization,spectral,verification,echo,pitch,dev]'
      - run: python -m ruff check speech_eval speechmetrichub tests scripts
      - run: python -m ruff format --check speech_eval speechmetrichub tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: python -m build
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Installed wheel smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import speechmetrichub as s; assert 'site-packages' in s.__file__; assert s.run('wer', reference='hello world', hypothesis='hello word')['value'] == 50.0"
          speechmetrichub list --category recognition
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.python }}
          path: dist/
